
name: Airbnb AI ML CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Train ML models
        run: |
          python train.py --n_estimators 100 --max_depth 10 --learning_rate 0.1

      - name: Run Pytest
        run: |
          python -m pytest -v --tb=short

      - name: Verify trained model
        run: |
          python -c "import joblib; print(type(joblib.load('model/model.joblib')))"
